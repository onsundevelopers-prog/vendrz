# Render Blueprint — deploys noma as a Node Web Service.
#
# This is what fixes the earlier failure: the repo was being treated as a
# static site (Render kept looking for a `dist` publish directory). Declaring
# it as a `web` service with runtimes means Render starts the Next.js server
# directly and never looks for `dist`.
#
# Deploy: on the Render dashboard go to "New + > Blueprint" and select this
# repo. Any missing env vars below are surfaced as prompts.

services:
  - type: web
    name: noma
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    # Cheap JSON probe - rendering the landing page for every health check
    # wastes a full server render per probe interval.
    healthCheckPath: /api/health
    # Persistent disk backing the file-based stores below. Without it,
    # payments, Gmail tokens and in-flight extraction jobs are silently
    # memory-only and vanish on every deploy/restart.
    disk:
      name: noma-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # AI inference provider (contract analysis). Gemini is primary and
      # rolls over to Ollama Cloud when unavailable/erroring.
      - key: AI_PROVIDER
        value: gemini    # or ollama_cloud / ollama_local
      # Google Gemini - primary inference provider.
      - key: GEMINI_API_KEY
        sync: false      # set it in the Render dashboard
      - key: GEMINI_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Ollama Cloud - automatic fallback when Gemini is unavailable/errors.
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false      # set it in the Render dashboard
      # Clerk authentication (DNS mode). The Clerk instance's primary domain
      # is n4ma.online - frontend API https://clerk.n4ma.online, DNS-verified
      # and live. clerk-js talks to clerk.n4ma.online directly from the
      # browser; do NOT set NEXT_PUBLIC_CLERK_PROXY_URL here (that is the
      # local-dev proxy path only). Paste the publishable + secret keys from
      # the Clerk dashboard (API Keys) into the Render dashboard - both are
      # marked sync:false so they are not read from this file.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk route overrides (match .env.example defaults).
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /auth?mode=login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /auth?mode=signup
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /dashboard
      # Access model (no payment processor): 30-day Team Plus trial auto-
      # starts server-side; after it ends, Team Plus is a one-time $250 CAD
      # e-transfer arranged by email. ADMIN_UPGRADE_TOKEN authorizes the
      # manual /api/entitlement step that grants access once a transfer is
      # confirmed.
      - key: ENTITLE_TRIAL_DAYS
        value: "30"
      - key: ADMIN_UPGRADE_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      # RBC Move Money API - outgoing transfers from your RBC business
      # account. Requires onboarding via your RBC Advisor; see .env.example
      # for full guidance. Never expose the client secret to the browser.
      - key: RBC_MOVE_MONEY_CLIENT_ID
        sync: false
      - key: RBC_MOVE_MONEY_CLIENT_SECRET
        sync: false
      - key: RBC_MOVE_MONEY_BASE_URL
        sync: false
      - key: RBC_MOVE_MONEY_FROM_ACCOUNT_ID
        sync: false
      - key: RBC_MOVE_MONEY_FROM_ACCOUNT_ID_TYPE
        sync: false
      - key: RBC_MOVE_MONEY_PAYMENT_TYPE
        sync: false
      # Clerk user ids allowed to actually send money via RBC.
      - key: PAYMENT_ADMINS
        sync: false
      # Persist payment records to a mounted persistent disk.
      - key: PAYMENT_STORE_FILE
        value: /data/payments.json
      # Gmail OAuth - server-only credential pair + token encryption.
      # The registered redirect URI must be <this-app>/api/gmail/callback.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_TOKEN_SECRET
        sync: false   # generate: openssl rand -base64 32
      # Google Drive OAuth - same Google OAuth client (both redirect URIs
      # registered) or a dedicated GOOGLE_DRIVE_CLIENT_ID/SECRET pair. The
      # registered redirect URI must be <this-app>/api/drive/callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DRIVE_TOKEN_SECRET
        sync: false   # optional; falls back to GMAIL_TOKEN_SECRET
      - key: DRIVE_TOKEN_FILE
        value: /data/drive-tokens.json
      # Slack OAuth - user-token scopes only (search:read files:read
      # users:read). The registered redirect URI must be
      # <this-app>/api/slack/callback.
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_TOKEN_SECRET
        sync: false   # optional; falls back to GMAIL_TOKEN_SECRET
      - key: SLACK_TOKEN_FILE
        value: /data/slack-tokens.json
      # Mount a persistent disk on the service and point the file stores at
      # it so Gmail/Drive/Slack tokens and in-flight extraction jobs survive
      # restarts.
      - key: GMAIL_TOKEN_FILE
        value: /data/gmail-tokens.json
      - key: EXTRACT_JOB_FILE
        value: /data/extract-jobs.json
      # Supabase persistence (workspace data + uploaded documents).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional one-time redemption codes (code:plan pairs). Omit to
      # disable code redemption entirely.
      - key: REDEEM_CODES
        sync: false
      # Anonymous extraction abuse bound (see src/lib/rateLimit.ts).
      # 0 disables limiting entirely.
      - key: EXTRACT_RATE_LIMIT
        value: "10"
      - key: EXTRACT_RATE_WINDOW_MS
        value: "3600000"
      # Canonical site URL - powers robots.txt, sitemap.xml and canonical/
      # OpenGraph tags. Set it to the live origin (e.g. https://noma.onrender.com)
      # so SEO metadata doesn't point at the default domain.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false