# Render Blueprint — deploys noma as a Node Web Service.
#
# This is what fixes the earlier failure: the repo was being treated as a
# static site (Render kept looking for a `dist` publish directory). Declaring
# it as a `web` service with runtimes means Render starts the Next.js server
# directly and never looks for `dist`.
#
# Deploy: on the Render dashboard go to "New + > Blueprint" and select this
# repo. Any missing env vars below are surfaced as prompts.

services:
  - type: web
    name: noma
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # AI inference provider (contract analysis).
      - key: AI_PROVIDER
        value: ollama_cloud    # or ollama_local for a self-hosted `ollama serve`
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false            # set it in the Render dashboard
      # Clerk authentication.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk route overrides (match .env.example defaults).
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /auth?mode=login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /auth?mode=signup
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /dashboard
      # PayPal subscriptions (Business plan). Public values are safe in the
      # repo; the REST pair is server-only. PAYPAL_WEBHOOK_ID powers the
      # /api/paypal/webhook endpoint that revokes Business mode on
      # cancellation/expiry - create the webhook in the PayPal dashboard
      # (URL: https://<this-app>/api/paypal/webhook) and paste its ID.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        value: BAAjyAyhnMTDiBOTtiavA40HQ7ObZlJ1SQkvhwYk8OTWkBd_Jdmlkk-QR0GMA_ds9YGun_QzJGJIf7p8eY
      - key: NEXT_PUBLIC_PAYPAL_PLAN_ID
        value: P-6JW433095T554031YNKJDN3I
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false