# Render Blueprint — deploys noma as a Node Web Service.
#
# This is what fixes the earlier failure: the repo was being treated as a
# static site (Render kept looking for a `dist` publish directory). Declaring
# it as a `web` service with runtimes means Render starts the Next.js server
# directly and never looks for `dist`.
#
# Deploy: on the Render dashboard go to "New + > Blueprint" and select this
# repo. Any missing env vars below are surfaced as prompts.

services:
  - type: web
    name: noma
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # AI inference provider (contract analysis).
      - key: AI_PROVIDER
        value: ollama_cloud    # or ollama_local for a self-hosted `ollama serve`
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false            # set it in the Render dashboard
      # Google Gemini - automatic fallback when Ollama is unavailable/errors.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Clerk authentication.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk route overrides (match .env.example defaults).
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /auth?mode=login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /auth?mode=signup
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /dashboard
      # PayPal subscriptions (Business plan). Public values are safe in the
      # repo; the REST pair is server-only. PAYPAL_WEBHOOK_ID powers the
      # /api/paypal/webhook endpoint that revokes Business mode on
      # cancellation/expiry - create the webhook in the PayPal dashboard
      # (URL: https://<this-app>/api/paypal/webhook) and paste its ID.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false          # set in the hosting dashboard (public client id)
      - key: NEXT_PUBLIC_PAYPAL_PLAN_ID
        sync: false          # Business plan id, set in the hosting dashboard
      # Team ($20/mo) subscription plan - create it in PayPal Billing > Plans
      # and paste the id here.
      - key: NEXT_PUBLIC_PAYPAL_PLAN_TEAM_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Business tier is a one-time purchase (default $999), granted
      # permanently. Team remains a monthly subscription.
      - key: BUSINESS_PRICE_USD
        value: "999"
      # Gmail OAuth - server-only credential pair + token encryption.
      # The registered redirect URI must be <this-app>/api/gmail/callback.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_TOKEN_SECRET
        sync: false   # generate: openssl rand -base64 32
      # Mount a persistent disk on the service and point both file stores at
      # it so Gmail tokens and in-flight extraction jobs survive restarts.
      - key: GMAIL_TOKEN_FILE
        value: /data/gmail-tokens.json
      - key: EXTRACT_JOB_FILE
        value: /data/extract-jobs.json
      # Supabase persistence (workspace data + uploaded documents).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional one-time redemption codes (code:plan pairs). Omit to
      # disable code redemption entirely.
      - key: REDEEM_CODES
        sync: false