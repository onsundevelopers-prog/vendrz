<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded off-white background, matching the reference mark (#F7F6F2). -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#F7F6F2"/>
  <!--
    N4 monogram in solid black with sharp geometric corners.

    The "4" (top):
      - diagonal stroke that angles upwards to the right, connecting to
      - a horizontal bar extending rightwards, and
      - a vertical stroke dropping down from the bar's right end.

    The "N" (bottom, integrated):
      - left vertical bar whose top edge is cut at a downward slope to the right,
      - a diagonal connecting the top of the left bar down to the bottom right,
      - a right vertical stem extending upward and intersecting the "4"'s bar.
  -->
  <g fill="none" stroke="#000000" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M12 30 L20 10"/>
    <path d="M12 30 L52 30"/>
    <path d="M52 30 L52 60"/>
    <path d="M16 60 L16 38 L28 44"/>
    <path d="M16 38 L52 60"/>
  </g>
</svg>
